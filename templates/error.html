<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="{{ url_for('static', filename='/img/fav.png') }}" type="image/x-icon">

    <title>Ops...</title>
    <style>
        .error_box {
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            width: 100%;
            height: 100vh;
            align-items: center;
            justify-content: center;
        }

        .error_message {
            align-content: center;
            text-align: center;
            width: 400px;
            height: 400px;
            border-radius: 20px;
            color: grey;
        }
    </style>
</head>
<body>
    <div class="error_box">
        <div class="error_message">
            {{ message }}
        </div>
    </div>
</body>
</html>
